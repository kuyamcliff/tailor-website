name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier
          POSTGRES_DB: atelier_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atelier" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./internal/... -count=1
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://atelier:atelier@localhost:5432/atelier_test?sslmode=disable
        run: go test ./tests/ -count=1
      - name: Build
        run: go build -o /tmp/api ./cmd/api
      - name: Lint the OpenAPI description
        run: npx --yes @redocly/cli@2.0.8 lint openapi/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run check:copy
      - run: npm test
      - run: npm run build
        env:
          BACKEND_URL: http://localhost:8080
          PUBLIC_SITE_URL: http://localhost:3000

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t atelier-api:${{ github.sha }} .
      - name: Build site image
        run: docker build --build-arg BACKEND_URL=http://api:8080 -t atelier-web:${{ github.sha }} frontend
