openapi: 3.1.0
info:
  title: Atelier API
  version: "1.0"
  license:
    name: MIT
    identifier: MIT
  summary: Storefront, bespoke requests, studio, payments and owner dashboard for the atelier.
  description: |
    JSON over HTTPS. Every path below is relative to `/api/v1`.

    **Who is calling.** Requests are anonymous, or carry one of:
    - a session cookie (`atelier_session`, set by sign in). State-changing requests from a session must
      also send `X-CSRF-Token` with the token returned by `/auth/me`;
    - a guest token (`X-Guest-Token`, 32 to 128 random characters kept by the browser) that owns
      designs, uploads and requests made without an account;
    - an access token (`X-Access-Token` header or `?token=`) from a confirmation link, which opens one
      order, request, quote, appointment or support thread.

    Owner endpoints need a staff session and the permission listed on each operation (`x-permissions`).

    **Money** is always an integer in minor units with a currency code (`totalMinor`, `currency`).
    **Times** are RFC 3339. **Measurements** are millimetres in responses; inputs say their unit.

    **Errors** share one shape (`Error`). Validation errors are 422 with a message per field.

    **Retries.** Operations that create orders, payments, requests, bookings and support threads require
    an `Idempotency-Key` header; repeating a request with the same key returns the first result with 200
    instead of creating a duplicate.

    **Payments** are only ever marked paid from the provider's own answer, read by the server. Callback
    bodies are not trusted, and the browser cannot set a payment's state.

    This document is checked against the router in `backend/tests/openapi_test.go`: a route without an
    entry here fails the build.
servers:
  - url: /api/v1
tags:
  - name: Site
    description: Public configuration, content, portfolio and testimonials.
  - name: Auth
    description: Accounts, sessions and passwords.
  - name: Catalog
    description: Products and fabrics.
  - name: Studio
    description: Garments, 3D assets and saved designs.
  - name: Measurements
    description: Measurement fields, profiles, versions and photo estimates.
  - name: Uploads
    description: Images and their private or public delivery.
  - name: Requests and quotes
    description: Bespoke requests and the customer side of quotes.
  - name: Orders and payments
    description: Checkout, orders and Mobile Money payments.
  - name: Appointments
    description: Slots and bookings.
  - name: Support
    description: Help threads.
  - name: Account
    description: The signed-in customer's own data.
  - name: "Owner: overview"
    description: Dashboard, notifications and audit log.
  - name: "Owner: requests and quotes"
    description: Request pipeline and quote revisions.
  - name: "Owner: orders"
    description: Production stages, notes, tasks and fittings.
  - name: "Owner: payments"
    description: Payments, rechecks, manual payments and refunds.
  - name: "Owner: customers"
    description: Customers and their measurements.
  - name: "Owner: appointments"
    description: Calendar, availability and booking for customers.
  - name: "Owner: support"
    description: Support inbox.
  - name: "Owner: catalogue"
    description: Products, categories and fabrics.
  - name: "Owner: garments and fit"
    description: Garment types, options, measurement fields, fit rules and sizes.
  - name: "Owner: 3D assets"
    description: Asset files and the review and publish pipeline.
  - name: "Owner: site"
    description: Portfolio and testimonials.
  - name: "Owner: settings"
    description: Content blocks, business settings and feature switches.
  - name: "Owner: staff"
    description: Staff accounts and roles.
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: atelier_session
      description: Session cookie from sign in. Send X-CSRF-Token on POST, PUT, PATCH and DELETE.
    guestToken:
      type: apiKey
      in: header
      name: X-Guest-Token
    accessToken:
      type: apiKey
      in: header
      name: X-Access-Token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 16 to 128 characters, unique per intended operation. Reuse it when retrying.
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [validation_failed, not_found, slot_taken, feature_disabled, payment_in_progress]
            message:
              type: string
              description: Safe to show to customers.
            fields:
              type: object
              additionalProperties:
                type: string
    Money:
      type: integer
      description: Amount in minor units of the currency (XAF has none).
    Contact:
      type: object
      required: [name, phone]
      properties:
        name: {type: string}
        phone: {type: string, description: "Local or international format; stored as E.164 digits"}
        email: {type: [string, "null"]}
        preferredContact: {type: string, enum: [whatsapp, phone, sms, email]}
    Address:
      type: object
      required: [recipient, phone, line1, city]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        label: {type: string}
        recipient: {type: string}
        phone: {type: string}
        line1: {type: string}
        line2: {type: string}
        city: {type: string}
        region: {type: string}
        country: {type: string}
        notes: {type: string}
        isDefault: {type: boolean}
    PublicConfig:
      type: object
      properties:
        business:
          type: object
          description: Name, contact details, address, opening hours, currency, time zone, social links.
        features:
          type: object
          additionalProperties: {type: boolean}
          description: studio, appointments, customer_accounts, support_inbox, guest_checkout, online_payments, reference_analysis, photo_body_estimation.
    MeResponse:
      type: object
      properties:
        user:
          oneOf:
            - type: "null"
            - type: object
              properties:
                id: {type: string, format: uuid}
                name: {type: string}
                email: {type: string}
                role: {type: string}
                isStaff: {type: boolean}
                permissions: {type: array, items: {type: string}}
                customerId: {type: [string, "null"], format: uuid}
                csrfToken: {type: string}
    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
        password: {type: string, minLength: 10}
        preferredContact: {type: string}
        marketingConsent: {type: boolean}
    SignInRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: {type: string, description: Email or phone}
        password: {type: string}
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: {type: string}
        password: {type: string, minLength: 10}
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string}
        newPassword: {type: string, minLength: 10}
    ProductList:
      type: object
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Product"}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
    Product:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        summary: {type: string}
        priceMinor: {$ref: "#/components/schemas/Money"}
        priceMaxMinor: {$ref: "#/components/schemas/Money"}
        availability: {type: string, enum: [in_stock, low_stock, out_of_stock, made_to_order]}
        category: {type: [object, "null"]}
        media:
          type: array
          items:
            type: object
            properties:
              url: {type: string}
              alt: {type: string}
              sample: {type: boolean, description: "True for licensed stock photos shown while real photography is pending"}
        variants: {type: array, items: {type: object}}
    Fabric:
      type: object
      properties:
        key: {type: string}
        name: {type: string}
        composition: {type: string}
        stockStatus: {type: string, enum: [available, low_stock, out_of_stock, discontinued, custom_order]}
        priceImpactMinor: {$ref: "#/components/schemas/Money"}
        colors: {type: array, items: {type: object, properties: {key: {type: string}, name: {type: string}, hex: {type: string}}}}
        pbr: {type: object, description: "Studio material: colour, normal and roughness maps (WebP or KTX2), roughness, sheen, repeat"}
        suitableGarments: {type: array, items: {type: string}}
    MeasurementsInput:
      type: object
      properties:
        unit: {type: string, enum: [cm, in]}
        height: {type: [number, "null"]}
        values: {type: object, additionalProperties: {type: number}, description: "Measurement key to value in the given unit"}
    DesignConfig:
      type: object
      required: [garment, selections]
      properties:
        garment: {type: string}
        selections: {type: object, description: "Option group key to choice key, or a number for range options"}
        fabric: {type: string}
        color: {type: string}
        baseline: {type: string, description: "Standard size label, or empty for made to measure"}
        fitPreference: {type: string, enum: [slim, regular, relaxed]}
        bodyModel: {type: string, enum: [masculine, feminine]}
        measurementVersionId: {type: [string, "null"], format: uuid}
        measurements: {$ref: "#/components/schemas/MeasurementsInput"}
        notes: {type: string}
    SaveDesignRequest:
      type: object
      required: [name, config]
      properties:
        name: {type: string}
        config: {$ref: "#/components/schemas/DesignConfig"}
        expectedVersion: {type: [integer, "null"], description: "Rejects the save with 409 if the design changed elsewhere"}
    Upload:
      type: object
      properties:
        id: {type: string, format: uuid}
        purpose: {type: string}
        visibility: {type: string, enum: [private, public]}
        originalName: {type: string}
        mime: {type: string}
        bytes: {type: integer}
        width: {type: integer}
        height: {type: integer}
        sha256: {type: string}
        url: {type: string}
        variants: {type: object, additionalProperties: {type: string}}
        duplicate: {type: boolean, description: "The same file was already uploaded; that upload is returned"}
    AnalysisRequest:
      type: object
      properties:
        garment: {type: string}
        tag: {type: string}
    SubmitRequest:
      type: object
      required: [garment, occasion, measurementMode, fabricMode, contact]
      properties:
        garment: {type: string}
        occasion: {type: string, enum: [wedding, work, ceremony, casual, everyday, photoshoot, graduation, other]}
        occasionNote: {type: string}
        measurementMode: {type: string, enum: [entered, saved, in_store]}
        measurements: {$ref: "#/components/schemas/MeasurementsInput"}
        measurementVersionId: {type: [string, "null"], format: uuid}
        bodyModel: {type: string}
        fitPreference: {type: string}
        fabricMode: {type: string, enum: [catalog, recommend, reference]}
        fabricKey: {type: string}
        colorKey: {type: string}
        designVersionId: {type: [string, "null"], format: uuid}
        references:
          type: array
          items:
            type: object
            properties:
              uploadId: {type: string, format: uuid}
              tag: {type: string}
              note: {type: string}
        notes: {type: string}
        desiredDate: {type: string, format: date}
        dateFlexibility: {type: string}
        urgency: {type: string}
        contact: {$ref: "#/components/schemas/Contact"}
    Created:
      type: object
      properties:
        id: {type: string, format: uuid}
        number: {type: string}
        accessToken: {type: string, description: "Opens this item without an account; also sent in the confirmation message"}
    MessageBody:
      type: object
      required: [message]
      properties:
        message: {type: string}
        attachments: {type: array, items: {type: string, format: uuid}}
    DecisionInput:
      type: object
      required: [revisionId]
      properties:
        revisionId: {type: string, format: uuid, description: "The revision the customer saw; 409 if the atelier has changed it since"}
        note: {type: string}
    CheckoutRequest:
      type: object
      required: [items, contact, fulfillment]
      properties:
        items:
          type: array
          items:
            type: object
            required: [variantId, quantity]
            properties:
              variantId: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1}
        contact: {$ref: "#/components/schemas/Contact"}
        fulfillment:
          type: object
          required: [zoneKey]
          properties:
            method: {type: string, enum: [pickup, local_delivery, courier]}
            zoneKey: {type: string}
            address: {$ref: "#/components/schemas/Address"}
            note: {type: string}
        notes: {type: string}
        expectedTotalMinor: {type: [integer, "null"], description: "409 if prices changed since the customer saw them"}
    CheckoutResult:
      type: object
      properties:
        orderId: {type: string, format: uuid}
        number: {type: string}
        accessToken: {type: string}
        totalMinor: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
    PaymentIntentRequest:
      type: object
      required: [orderId, provider, msisdn]
      properties:
        orderId: {type: string, format: uuid}
        provider: {type: string, enum: [mtn, orange]}
        msisdn: {type: string, description: "The Mobile Money number that will pay"}
        purpose: {type: string, enum: [full, deposit, balance], description: "Chosen from the order when omitted"}
    Payment:
      type: object
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        purpose: {type: string}
        provider: {type: string}
        providerName: {type: string}
        amountMinor: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        status: {type: string, enum: [created, pending, customer_action_required, processing, succeeded, failed, expired, cancelled, refunded, partially_refunded]}
        simulated: {type: boolean, description: "Development simulator; never counted as revenue and refused in production"}
        failureMessage: {type: [string, "null"]}
        payer: {type: string, description: "Masked number"}
        expiresAt: {type: string, format: date-time}
        succeededAt: {type: [string, "null"], format: date-time}
        createdAt: {type: string, format: date-time}
        existing: {type: boolean, description: "An in-flight payment for this order was returned instead of a new one"}
    Slots:
      type: object
      properties:
        slots: {type: array, items: {type: string, format: date-time}}
        timezone: {type: string}
        durationMinutes: {type: integer}
        from: {type: string, format: date}
        to: {type: string, format: date}
    BookRequest:
      type: object
      required: [type, startsAt, contact]
      properties:
        type: {type: string, enum: [consultation, measuring, fitting, final_fitting, pickup, alteration, video_consultation, other]}
        startsAt: {type: string, format: date-time}
        contact: {$ref: "#/components/schemas/Contact"}
        notes: {type: string}
        orderId: {type: [string, "null"], format: uuid}
        requestId: {type: [string, "null"], format: uuid}
        orderToken: {type: string}
    Appointment:
      type: object
      properties:
        id: {type: string, format: uuid}
        number: {type: string}
        type: {type: string}
        typeLabel: {type: string}
        status: {type: string, enum: [booked, cancelled, completed, no_show]}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        location: {type: string}
        canChange: {type: boolean}
    AppointmentChange:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [reschedule, cancel]}
        startsAt: {type: string, format: date-time}
    SupportCreate:
      type: object
      required: [subject, category, message]
      properties:
        subject: {type: string}
        category: {type: string, enum: [general, order_issue, measurement_help, payment_issue, appointment_issue, alteration_request, other]}
        message: {type: string}
        orderId: {type: [string, "null"], format: uuid}
        attachments: {type: array, items: {type: string, format: uuid}}
        contact: {$ref: "#/components/schemas/Contact"}
    SupportReply:
      type: object
      required: [body]
      properties:
        body: {type: string}
        attachments: {type: array, items: {type: string, format: uuid}}
    ProfileInput:
      type: object
      required: [name, bodyModel, unit]
      properties:
        name: {type: string}
        bodyModel: {type: string, enum: [masculine, feminine]}
        unit: {type: string, enum: [cm, in]}
        ageRange: {type: [string, "null"]}
        fitPreference: {type: string, enum: [slim, regular, relaxed]}
        isDefault: {type: boolean}
    VersionInput:
      allOf:
        - $ref: "#/components/schemas/MeasurementsInput"
        - type: object
          properties:
            source: {type: string, enum: [customer_entered, estimated]}
            garment: {type: string, description: "Validate against this garment's required fields"}
            notes: {type: string}
    EstimateRequest:
      type: object
      required: [frontUploadId, sideUploadId, heightMm, weightKg, age, bodyModel, consent]
      properties:
        frontUploadId: {type: string, format: uuid, description: "An upload with purpose body_photo"}
        sideUploadId: {type: string, format: uuid}
        heightMm: {type: integer, minimum: 1200, maximum: 2300}
        weightKg: {type: number, minimum: 30, maximum: 250}
        age: {type: integer, minimum: 16, maximum: 100}
        bodyModel: {type: string, enum: [masculine, feminine]}
        consent: {type: boolean, const: true}
    Estimate:
      type: object
      properties:
        provider: {type: string}
        heightMm: {type: integer}
        valuesMm: {type: object, additionalProperties: {type: integer}}
        flags: {type: array, items: {type: object}, description: "Combinations worth a second look"}
paths:
  /openapi.yaml:
    get:
      tags:
        - "Site"
      summary: "This API description (OpenAPI 3.1, YAML)"
      operationId: "get_openapi_yaml"
      security:
        - {}
      responses:
        200:
          description: "OpenAPI document"
          content:
            application/yaml:
              schema:
                type: "string"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
          "$ref": "#/components/responses/Error"
  /config:
    get:
      tags:
        - "Site"
      summary: "Public configuration: business details, currency, enabled features and payment methods"
      operationId: "get_config"
      security:
        - {}
        - session: []
        - guestToken: []
        - accessToken: []
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicConfig"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
          "$ref": "#/components/responses/Error"
  /content:
    get:
      tags:
        - "Site"
      summary: "Published content blocks (home, services, FAQs, policies, footer)"
      operationId: "get_content"
      security:
        - {}
        - session: []
        - guestToken: []
        - accessToken: []
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
          "$ref": "#/components/responses/Error"
  /auth/me:
    get:
      tags:
        - "Auth"
      summary: "The signed-in user, or null"
      operationId: "get_auth_me"
      security:
        - {}
        - session: []
        - guestToken: []
        - accessToken: []
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MeResponse"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
          "$ref": "#/components/responses/Error"
  /auth/signup:
    post:
      tags:
        - "Auth"
      summary: "Create a customer account and sign in"
      operationId: "post_auth_signup"
      security:
        - {}
        - session: []
        - guestToken: []
        - accessToken: []
      x-rate-limit: "10 per minute per client (auth)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SignUpRequest"
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MeResponse"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
          "$ref": "#/components/responses/Error"
  /auth/signin:
    post:
      tags:
        - "Auth"
      summary: "Sign in with email or phone and password (locked after repeated failures)"
      operationId: "post_auth_signin"
      security:
        - {}
        - session: []
        - guestToken: []
        - accessToken: []
      x-rate-limit: "10 per minute per client (auth)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SignInRequest"
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MeResponse"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
          "$ref": "#/components/responses/Error"
  /auth/signout:
    post:
      tags:
        - "Auth"
      summary: "Sign out and revoke this session"
      operationId: "post_auth_signout"
      security:
        - {}
        - session: []
        - guestToken: []
        - accessToken: []
      responses:
        204:
          description: "Done"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
          "$ref": "#/components/responses/Error"
  /auth/password-reset:
    post:
      tags:
        - "Auth"
      summary: "Send a password reset link (always answers 204, so accounts cannot be discovered)"
      operationId: "post_auth_password_reset"
      security:
        - {}
        - session: []
        - guestToken: []
        - accessToken: []
      x-rate-limit: "5 per 15 minutes per client (reset)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetRequest"
      responses:
        204:
          description: "Done"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
          "$ref": "#/components/responses/Error"
  /auth/password-reset/confirm:
    post:
      tags:
        - "Auth"
      summary: "Set a new password with a reset token; revokes all sessions"
      operationId: "post_auth_password_reset_confirm"
      security:
        - {}
        - session: []
        - guestToken: []
        - accessToken: []
      x-rate-limit: "5 per 15 minutes per client (reset)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetConfirm"
      responses:
        204:
          description: "Done"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
          "$ref": "#/components/responses/Error"
  /auth/password:
    post:
      tags:
        - "Auth"
      summary: "Change password; other sessions are revoked"
      operationId: "post_auth_password"
      security:
        - session: []
      description: "Session requests must send the X-CSRF-Token header."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ChangePasswordRequest"
      responses:
        204:
          description: "Done"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
          "$ref": "#/components/responses/Error"
  /auth/sessions:
    get:
      tags:
        - "Auth"
      summary: "Signed-in devices"
      operationId: "get_auth_sessions"
      security:
        - session: []
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
          "$ref": "#/components/responses/Error"
  /auth/sessions/revoke-others:
    post:
      tags:
        - "Auth"
      summary: "Sign out every other device"
      operationId: "post_auth_sessions_revoke_others"
      security:
        - session: []
      description: "Session requests must send the X-CSRF-Token header."
      responses:
        204:
          description: "Done"
        4XX:
          "$ref": "#/components/responses/Error"
        5XX:
